name: Xbox editor checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  tests:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.14'
          check-latest: true
      - run: python -m pip install --upgrade pip "setuptools>=84.1"
      - run: python -m pip install -e ".[dev]"
      - run: python -m pip install pip-audit==2.10.1
      - name: Audit installed dependencies
        run: |
          python -m pip freeze --all --exclude choops-recomp-studio > audit-requirements.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m pip_audit --strict --no-deps --disable-pip -r audit-requirements.txt
      - run: python -m pytest -q
