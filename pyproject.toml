[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
[project]
name = "choops-recomp-studio"
version = "0.1.0"
description = "Xbox College Hoops loose-assets modding studio"
requires-python = ">=3.11"
dependencies = ["PySide6>=6.8,<7", "Pillow>=11", "jsonschema>=4.23,<5"]
[project.optional-dependencies]
dev = ["pytest>=8", "pytest-qt>=4", "PyInstaller>=6"]
[project.scripts]
choops-recomp = "choops_recomp.cli:main"
[project.gui-scripts]
choops-recomp-studio = "choops_recomp.ui.app:main"
[tool.setuptools.packages.find]
include = ["choops_recomp*"]
[tool.setuptools.package-data]
choops_recomp = ["data/*.json"]
[tool.pytest.ini_options]
testpaths = ["tests"]
